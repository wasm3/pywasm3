name: Coverage

on:
  push:
    branches:
      - "main"
    paths: &code-paths
      - "pyproject.toml"
      - "setup.py"
      - "src/**"
      - "tests/**"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches:
      - "*"
    paths: *code-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the defaults wholesale: every scope not listed here
      # becomes `none`, so contents must be granted explicitly for actions/checkout.
      contents: read
      id-token: write
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for setuptools-scm
          submodules: recursive

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
        with:
          python-version: "3.14"
          github-token: ${{ github.token }}

      - name: Install gcovr
        run: |
          uv tool install gcovr

      - name: Install the project
        run: uv sync
        shell: bash

      # The code worth measuring is C (__init__.py is a shim), so this is gcov, not
      # coverage.py. In-place because a normal install compiles in a temp dir that is
      # deleted, taking the .gcno notes the runtime .gcda files are written next to.
      # --with: setuptools/setuptools-scm are build-time only, not in the dev group.
      - name: Build the extension in-place, gcov-instrumented
        run: uv run --with setuptools --with setuptools-scm python setup.py build_ext --inplace --force
        shell: bash
        env:
          PYWASM3_COVERAGE: "1"

      # --no-sync: keeps the instrumented in-place build pytest imports.
      - name: Run tests
        run: uv run --no-sync pytest
        shell: bash

      # --filter: report on the binding only, not on wasm3's own sources.
      - name: Build coverage report
        run: |
          gcovr --root . --filter 'src/wasm3/' --xml coverage.xml --html-details coverage.html --print-summary
        shell: bash

      # Fork PRs are capped at a read-only GITHUB_TOKEN no matter what the permissions
      # block above asks for, so id-token: write is never granted and the OIDC handshake
      # fails. Tests + the gcovr summary still run there; only the upload is skipped.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true
